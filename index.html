<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DexFinder</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>DexFinder</h1>
        <h2>Find the stats that the games don't show you</h2>
    </header>
    <main>
        <div>
            <h2>Search for a Pokémon:</h2>
            <input type="text" class="search-bar" id="pokemon-input" placeholder="Enter Pokémon species name or Pokédex ID"><br>
            <button id="search-button">Search</button>
        </div>
        <div class="flex-container">
            
                <section class="box">
                <h2>General Info</h2>
                <p>(General info goes here)</p>
            </section>
            <section class="box">
                <h2>Individual Values (IVs)</h2>
                <p>(IV info goes here)</p>
            </section>
            <section class="box">
                <h2>Effort Values (EVs)</h2>
                <p>(EV info goes here)</p>
            </section>
        </div>
    </main>

    <footer>
        Created by Chris Duncan<br>
        <a href="mailto:cdunca13@my.westga.edu">Contact</a>
    </footer>
</body>
</html>
